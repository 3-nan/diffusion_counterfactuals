resume: False    # False True
fixed_seed: False
record_intermediate: False
output_dir: /results/counterfactuals/pets_vit_concept_10_scale_5_b8 #mlpfc2 #_spatial_optim

diffusion_model:
  # cfg_path: "configs/latent-diffusion/cin256-v2.yaml"
  # ckpt_path: "models/ldm/nitro_cin/model.ckpt"
  cfg_path: "configs/stable-diffusion/v1-inference.yaml"
  ckpt_path: "/Data/models/miniSD/miniSD.ckpt" # miniSD https://huggingface.co/justinpinkney/miniSD/tree/main

seg_model:
classifier_model:
  name: vit_base_patch16_224 # "vgg16_bn"      # vgg16   vgg16_bn  resnet18  resnet50
  # classifier_path: "/results/models/vgg16bn_pets_20240503_092321_7_0.92"
  classifier_path: "/results/models/vit_base_patch16_224_pets_20240923_143234_3_0.92"

# counterfactual_target: baseline # actattr attribution activation baseline
target_norm: False   # False True

concept_layer: blocks.10  #.mlp.fc2 #blocks.10.mlp.fc2 #features.37    # 29  # features.37 # features.40  layer4.1.conv1  layer3.1.conv1
num_concepts: 10  # 6
spatial: False     # False True
cond_option: sumabs     # abssum absmax

n_samples_per_class: #2
strength: 0.382 #0.322 #0.382 #0.34 #0.3 #28 #0.25
scale: 5 #2.45 #2.85
ddim_steps: 500 #500 #375 
ddim_eta: 0.
log_rate: 1

data:
  _target_: data.datasets.OxfordIIIPets
  root: '/Data/PETS'
