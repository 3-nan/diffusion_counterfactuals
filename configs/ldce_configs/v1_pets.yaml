  # split: 'val'
  # return_tgt_cls: True
  batch_size: 2
  # start_sample: 0
  # end_sample: 10
  shard: 0
  num_shards: 7
  # batch_size: 1
  image_size: 256

sampler:
  self_recurrence: 0
  self_recurrence_every_n_steps: 0
  enforce_same_norms: True
  guidance: "projected"
  cone_projection_type: "zero_binning"
  classifier_lambda: 2.3 # 2.3 #3.3     # 3.4
  dist_lambda: 0.1 #0.3 # 0.3
  masked_guidance: False
  backprop_diffusion: True   
  lp_custom: 1
  deg_cone_projection: 45. # 45.