resume: False    # False True
fixed_seed: False
record_intermediate: False
# output_dir: /results/counterfactuals/diffusers_stable_imagenet_vit_concept_20_scale_7 #s_0382_scale_7_cl_13_dist_002_deg_45_prompt   #_37_concept_20_spatial_optim
output_dir: /results/counterfactuals/diffusers_kandinsky_imagenet_vit_concept_20_scale_7_final

diffusion_model:
  cfg_path: "configs/latent-diffusion/cin256-v2.yaml"
  ckpt_path: "models/ldm/nitro_cin/model.ckpt"

# diffusion_type: "stable_diffusion"
diffusion_type: "kandinsky"

seg_model:
classifier_model:
  name: vit_base_patch16_224  #"vgg16_bn"      # vgg16   vgg16_bn  resnet18  resnet50 vit_base_patch16_224

counterfactual_target: baseline # actattr attribution activation baseline
target_norm: False   # False True

concept_conditioning: True #False   # False True

concept_layer: blocks.10.mlp.fc2 #features.37    # 29  # features.37 # features.40  layer4.1.conv1  layer3.1.conv1 blocks.10.mlp.fc2
num_concepts: 20  # 6
spatial: False     # False True
cond_option: sumabs     # abssum absmax

n_samples_per_class: #2
strength: 0.382 #0.382 #0.382 #0.322 #0.382 #0.34 #0.3 #28 #0.25
scale: 7 #2.10 #3 #2.45 #2.85       # stable ~6 # kandinsky ~3  stable_original=7.5
ddim_steps: 500 #500 #375 
ddim_eta: 0.
log_rate: 1

data:
  _target_: data.datasets.ImageNet
  root: '/Data/imagenet/val'
  idx_to_tgt_cls_path: './ldce/data/image_idx_to_tgt.yaml'
  split: 'val'
  return_tgt_cls: True
  batch_size: 1 #1 #2 #4
  start_sample: 0
  end_sample: 10
  image_size: 512     # 256 #512

sampler:
  self_recurrence: 0
  self_recurrence_every_n_steps: 0
  enforce_same_norms: True
  guidance: "projected"
  cone_projection_type: "zero_binning"
  classifier_lambda: 2.3 # 2.3 #3.3
  dist_lambda: 0.002 #0.3 # 0.3
  masked_guidance: False
  backprop_diffusion: True   
  lp_custom: 0 #1
  deg_cone_projection: 45. # 45.