resume: False    # False True
fixed_seed: False
record_intermediate: False
output_dir: /results/counterfactuals/celeba_concept_20_vit_scale_6 #_spatial_optim
# output_dir: /results/counterfactuals/diffusers_celeba_resnet18_test

diffusion_model:
  # cfg_path: "configs/latent-diffusion/cin256-v2.yaml"
  # ckpt_path: "models/ldm/nitro_cin/model.ckpt"
  cfg_path: "configs/stable-diffusion/v1-inference.yaml"
  ckpt_path: "/Data/models/miniSD/miniSD.ckpt" # miniSD https://huggingface.co/justinpinkney/miniSD/tree/main

diffusion_type: "stable_diffusion"
concept_conditioning: True

seg_model:
classifier_model:
  # name: "vgg16_bn"      # vgg16   vgg16_bn  resnet18  resnet50
  # classifier_path: "/results/models/celeba_vgg16_bn_0.931.pth"
  name: vit_base_patch16_224 # "resnet18"
  # classifier_path: "/results/models/celeba_resnet18_0.923.pth"
  classifier_path: /results/models/celeba_vit_base_patch16_224_0.926.pth

# counterfactual_target: baseline # actattr attribution activation baseline
target_norm: False   # False True

concept_layer: classifier.blocks.10.mlp.fc2  # classifier.layer4.1.conv1   # 29  # features.37 # features.40  layer4.1.conv1  layer3.1.conv1
num_concepts: 20  # 6
spatial: False #True     # False True
cond_option: sumabs     # abssum absmax

n_samples_per_class: #2
strength: 0.302 # 0.402 #0.502 #0.382 #0.322 #0.382 #0.34 #0.3 #28 #0.25
scale: 6 #2.1 #2.1 #7.4 #3 #2.45 #2.85       # 6.4
ddim_steps: 500 #500 #375 
ddim_eta: 0.
log_rate: 1

data:
  _target_: data.datasets.CelebADataset
  data_dir: '/Data/'
  random_crop: False
  random_flip: False
  partition: 'test'
  query_label: 31 # 31 -> smiling; 39 -> age 2 -> attractive 4 -> bald
  normalize: False
  batch_size: 2 #2 #4 #2 #4
  shard: 0
  num_shards: 1
  image_size: 256 #512 #512

sampler:
  self_recurrence: 0
  self_recurrence_every_n_steps: 0
  enforce_same_norms: True
  guidance: "projected"
  cone_projection_type: "zero_binning"
  classifier_lambda: 2.3  #2.3 # 2.3 #3.3     # 3.4       # 1
  dist_lambda: 0.3 #0.3 # 0.3                       # 0.25
  masked_guidance: False
  backprop_diffusion: True   
  lp_custom: 1
  deg_cone_projection: 45. # 45.