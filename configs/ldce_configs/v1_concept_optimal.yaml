resume: False
fixed_seed: False
record_intermediate: False
output_dir: /results/counterfactuals/imagenet_vgg16bn_optimal_6

diffusion_model:
  cfg_path: "configs/latent-diffusion/cin256-v2.yaml"
  ckpt_path: "models/ldm/nitro_cin/model.ckpt"

seg_model:
classifier_model:
  name: "vgg16_bn"      # vgg16   vgg16_bn  resnet18  resnet50

counterfactual_target: attribution # actattr attribution activation baseline
target_norm: False   # False True

concept_layer: features.40    # 29  # features.37 # features.40  layer4.1.conv1
num_concepts: 6  # 6
spatial: True     # False True
cond_option: sumabs     # abssum absmax

n_samples_per_class: #2
strength: 0.382 #0.322 #0.382 #0.34 #0.3 #28 #0.25
scale: 3 #2.45 #2.85
ddim_steps: 500 #500 #375 
ddim_eta: 0.
log_rate: 1

data:
  _target_: data.datasets.ImageNet
  root: '/Data/imagenet/val'
  idx_to_tgt_cls_path: './ldce/data/image_idx_to_tgt.yaml'
  split: 'val'
  return_tgt_cls: True
  batch_size: 4
  start_sample: 0
  end_sample: 10

sampler:
  self_recurrence: 0
  self_recurrence_every_n_steps: 0
  enforce_same_norms: True
  guidance: "projected"
  cone_projection_type: "zero_binning"
  classifier_lambda: 3.3 # 2.3 #3.3
  dist_lambda: 0.01 #0.3 # 0.3
  masked_guidance: False
  backprop_diffusion: True   
  lp_custom: 1
  deg_cone_projection: 20. # 45.